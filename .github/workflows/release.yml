name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach to a draft release
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Ensure deb packaging dependency
        run: sudo apt-get install -y libcrypt1

      - name: Build AppImage and deb
        run: npm run dist:linux

      - name: Smoke-test packaged app
        run: xvfb-run -a npm run test:packaged

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          if-no-files-found: error
          path: |
            dist/desktop/*.AppImage
            dist/desktop/*.deb

  windows:
    name: Windows packages
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Build portable and NSIS installers
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          if-no-files-found: error
          path: dist/desktop/*.exe

  draft:
    name: Draft release and checksums
    runs-on: ubuntu-latest
    needs: [linux, windows]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-dist"
          merge-multiple: true
          path: dist/desktop

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Write SHA256SUMS
        run: node scripts/checksums.mjs

      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets."
          else
            gh release create "$TAG" \
              --draft \
              --title "Tic Tac Nought $TAG" \
              --generate-notes \
              --repo "$GH_REPO"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          find dist/desktop -maxdepth 1 -type f \
            \( -name 'SHA256SUMS' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' \) \
            -print0 \
            | xargs -0 -r gh release upload "$TAG" --repo "$GH_REPO" --clobber

      - name: Show checksums
        run: cat dist/desktop/SHA256SUMS
