name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web, PWA, and Electron
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Build web app
        run: npm run build:web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: PWA and save-transfer tests
        run: npm run test:pwa

      - name: Electron smoke test
        run: xvfb-run -a npm run test:electron

  windows:
    name: Windows build check
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Build web app
        run: npm run build:web

      - name: Verify Windows packaging
        run: npx electron-builder --win --dir
